name: Build municipal image

# Slovak-default simple-mode build of the upstream Dockerfile
# (nginx-unprivileged, uid 101, static client-side app). The upstream
# build-and-publish.yml is gated to alam00000/bentopdf, so the fork needs this.
# Tag is incremental: <package.json version>-<workflow run number>, no latest.
# .github/municipal/prepare.sh bundles every WASM/OCR/font asset, adds a
# self-only CSP and leaves brand, footer and site URL as placeholders that the
# container fills from BRAND_NAME, FOOTER_TEXT, SITE_URL at start. It edits the
# CI checkout only (never committed), so upstream merges stay conflict-free.
# verify.sh gates the push.
on:
  workflow_dispatch:
    inputs:
      ocr_languages:
        description: Tesseract languages bundled for offline OCR
        default: slk,ces,eng

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OCR_LANGS: ${{ inputs.ocr_languages || 'slk,ces,eng' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - id: prep
        run: |
          bash .github/municipal/prepare.sh "$OCR_LANGS"
          VERSION=$(node -p "require('./package.json').version")
          echo "image=ghcr.io/${{ github.repository_owner }}/bentopdf:${VERSION}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          { echo 'args<<EOF'; cat municipal.build-args; echo EOF; } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # context: . builds the prepared checkout (the default git context would
      # rebuild the pristine commit). load: true so verify.sh runs before push.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: ${{ steps.prep.outputs.args }}
          tags: ${{ steps.prep.outputs.image }}
          # Upstream's Dockerfile labels the image with its own repo; GHCR links
          # the package to the repo named here.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          platforms: linux/amd64
          cache-from: type=gha,scope=sk
          cache-to: type=gha,mode=max,scope=sk

      - run: bash .github/municipal/verify.sh "${{ steps.prep.outputs.image }}" "$OCR_LANGS"

      - run: |
          docker push "${{ steps.prep.outputs.image }}"
          echo "Built ${{ steps.prep.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
