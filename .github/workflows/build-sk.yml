name: Build municipal image

# Slovak-default simple-mode build of the upstream non-root Dockerfile
# (nginx-unprivileged, uid 101, static client-side app). The upstream
# build-and-publish.yml is gated to alam00000/bentopdf, so the fork needs this.
# Tag is incremental: <package.json version>-<workflow run number>, no latest.
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public canonical URL of the deployment
        default: https://pdf.city.marek-mraz.com

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=${VERSION}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          push: true
          build-args: |
            SIMPLE_MODE=true
            VITE_DEFAULT_LANGUAGE=sk
            SITE_URL=${{ inputs.site_url || 'https://pdf.city.marek-mraz.com' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/bentopdf:${{ steps.meta.outputs.tag }}
          platforms: linux/amd64
          cache-from: type=gha,scope=sk
          cache-to: type=gha,mode=max,scope=sk

      - run: echo "Built ghcr.io/${{ github.repository_owner }}/bentopdf:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
